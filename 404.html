<script>
  // Teksten in de taal van de bezoeker (zelfde keuze als op de rest van de site)
  (function () {
    const talen = ['nl', 'en', 'fr'];
    let taal = null;
    try { taal = localStorage.getItem('taal'); } catch (e) {}
    if (!talen.includes(taal)) taal = (navigator.language || 'nl').slice(0, 2);
    if (!talen.includes(taal)) taal = 'nl';

    const t = window.VERTALINGEN[taal];
    document.documentElement.lang = taal;
    document.querySelectorAll('[data-t]').forEach(el => {
      const waarde = el.dataset.t.split('.').reduce((o, k) => o && o[k], t);
      if (typeof waarde === 'string') el.textContent = waarde;
    });
  })();
</script>
