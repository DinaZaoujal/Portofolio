<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower — 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#f0d9e0}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<three-d-stage name="flower" background="#f0d9e0" autorotate></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const M = {
  petal:   new THREE.MeshStandardMaterial({ name:'petal',   color:0xe59aad, roughness:0.62, metalness:0.03, side:THREE.DoubleSide }),
  throat:  new THREE.MeshStandardMaterial({ name:'throat',  color:0x8e1526, roughness:0.6,  metalness:0.03, side:THREE.DoubleSide }),
  column:  new THREE.MeshStandardMaterial({ name:'column',  color:0xf3d9c8, roughness:0.55, metalness:0.03 }),
  anther:  new THREE.MeshStandardMaterial({ name:'anther',  color:0xe2a520, roughness:0.7,  metalness:0.05 }),
  stigma:  new THREE.MeshStandardMaterial({ name:'stigma',  color:0xc02330, roughness:0.5,  metalness:0.05 }),
  stem:    new THREE.MeshStandardMaterial({ name:'stem',    color:0x4c7a3f, roughness:0.7,  metalness:0.05 }),
  leaf:    new THREE.MeshStandardMaterial({ name:'leaf',    color:0x548b3e, roughness:0.66, metalness:0.04, side:THREE.DoubleSide })
};

// Hibiscus petal: broad rounded fan, narrow claw at the base, ruffled outer edge.
function hibiscusPetal(len, wide, thick, curveSegments = 40, steps = 10) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(wide * 0.16, len * 0.14, wide * 0.62, len * 0.30, wide * 0.90, len * 0.66);
  s.bezierCurveTo(wide * 1.02, len * 0.90, wide * 0.60, len * 1.02, 0, len);
  s.bezierCurveTo(-wide * 0.60, len * 1.02, -wide * 1.02, len * 0.90, -wide * 0.90, len * 0.66);
  s.bezierCurveTo(-wide * 0.62, len * 0.30, -wide * 0.16, len * 0.14, 0, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: true, bevelThickness: thick * 0.6, bevelSize: thick * 0.7, bevelSegments: 2, curveSegments, steps });
  g.translate(0, 0, -thick / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = Math.max(0, Math.min(1, y / len));
    const rel = x / (wide * 0.95);
    // gentle upward cup near the base, tips arcing back, ruffle along the rim
    const cup = -(1 - t) * (1 - t) * len * 0.05;
    const flare = t * t * len * 0.09;
    const ruffle = Math.sin(rel * Math.PI * 3.0) * len * 0.035 * Math.pow(t, 2.2);
    p.setZ(i, z + cup + flare + ruffle);
    p.setY(i, y - t * t * len * 0.06);
  }
  g.computeVertexNormals();
  return g;
}

const flower = new THREE.Group();
flower.name = 'hibiscus';

const bloom = new THREE.Group();
bloom.name = 'bloom';

const PETAL_LEN = 0.180, PETAL_WIDE = 0.076;
const petalGeo = hibiscusPetal(PETAL_LEN, PETAL_WIDE, 0.0035);
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2;
  const petal = new THREE.Mesh(petalGeo, M.petal);
  petal.name = `petal_${i + 1}`;
  petal.rotation.order = 'YXZ';
  petal.rotation.y = a;
  petal.rotation.x = -(Math.PI / 2 - 0.10);
  petal.rotation.z = 0.13;           // overlap, like a pinwheel
  petal.position.set(Math.sin(a) * 0.030, 0.003 + i * 0.0018, Math.cos(a) * 0.030);
  bloom.add(petal);
}

// deep crimson throat, a shallow cone the petals sit around
const throat = new THREE.Mesh(new THREE.ConeGeometry(0.050, 0.024, 48, 1, true), M.throat);
throat.name = 'throat';
throat.position.y = 0.008;
bloom.add(throat);
const throatFloor = new THREE.Mesh(new THREE.CircleGeometry(0.050, 48), M.throat);
throatFloor.name = 'throat_floor';
throatFloor.rotation.x = -Math.PI / 2;
throatFloor.position.y = -0.0015;
bloom.add(throatFloor);

const flareGeo = hibiscusPetal(0.070, 0.032, 0.0022, 10, 2);
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2;
  const fl = new THREE.Mesh(flareGeo, M.throat);
  fl.name = `throat_flare_${i + 1}`;
  fl.rotation.order = 'YXZ';
  fl.rotation.y = a;
  fl.rotation.x = -(Math.PI / 2 - 0.10);
  fl.rotation.z = 0.13;
  fl.position.set(Math.sin(a) * 0.030, 0.012 + i * 0.0018, Math.cos(a) * 0.030);
  bloom.add(fl);
}

// staminal column
const column = new THREE.Mesh(new THREE.CylinderGeometry(0.0042, 0.0062, 0.135, 24), M.column);
column.name = 'staminal_column';
column.position.y = 0.072;
bloom.add(column);

// anthers along the upper column
for (let i = 0; i < 46; i++) {
  const t = i / 46;
  const a = i * 2.399963;
  const h = 0.085 + t * 0.052;
  const r = 0.0055 + Math.sin(t * Math.PI) * 0.011;
  const fil = new THREE.Mesh(new THREE.CylinderGeometry(0.0006, 0.0006, r, 6), M.column);
  fil.name = `filament_${i + 1}`;
  fil.position.set(Math.cos(a) * r * 0.5, h, Math.sin(a) * r * 0.5);
  fil.rotation.z = -Math.cos(a) * 1.1;
  fil.rotation.x = Math.sin(a) * 1.1;
  bloom.add(fil);
  const anther = new THREE.Mesh(new THREE.SphereGeometry(0.0028, 8, 6), M.anther);
  anther.name = `anther_${i + 1}`;
  anther.position.set(Math.cos(a) * r, h + 0.004, Math.sin(a) * r);
  bloom.add(anther);
}

// five stigma knobs at the tip
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2 + 0.4;
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.0009, 0.0009, 0.012, 8), M.stigma);
  arm.name = `style_${i + 1}`;
  arm.position.set(Math.cos(a) * 0.005, 0.1425, Math.sin(a) * 0.005);
  arm.rotation.z = -Math.cos(a) * 0.5;
  arm.rotation.x = Math.sin(a) * 0.5;
  bloom.add(arm);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.0038, 14, 12), M.stigma);
  knob.name = `stigma_${i + 1}`;
  knob.position.set(Math.cos(a) * 0.0085, 0.1485, Math.sin(a) * 0.0085);
  bloom.add(knob);
}

// green calyx under the bloom
const calyx = new THREE.Mesh(new THREE.SphereGeometry(0.026, 32, 16, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5), M.stem);
calyx.name = 'calyx';
calyx.scale.set(1, 0.85, 1);
calyx.position.y = 0.001;
bloom.add(calyx);
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const sep = new THREE.Mesh(new THREE.ConeGeometry(0.005, 0.032, 8), M.stem);
  sep.name = `sepal_${i + 1}`;
  sep.position.set(Math.cos(a) * 0.021, -0.006, Math.sin(a) * 0.021);
  sep.rotation.z = -Math.cos(a) * 0.5;
  sep.rotation.x = Math.sin(a) * 0.5;
  bloom.add(sep);
}

bloom.position.y = 0.60;
bloom.rotation.z = 0.12;
flower.add(bloom);

const stemCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.014, 0, 0.004),
  new THREE.Vector3(-0.014, 0.16, 0.01),
  new THREE.Vector3(0.016, 0.33, -0.006),
  new THREE.Vector3(-0.004, 0.49, 0.004),
  new THREE.Vector3(0, 0.598, 0)
]);
const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 64, 0.0092, 20, false), M.stem);
stem.name = 'stem';
flower.add(stem);

// hibiscus leaf: ovate with a toothed edge
function leafGeometry(len, wide) {
  const s = new THREE.Shape();
  const pts = [];
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const y = t * len;
    const base = Math.sin(Math.pow(t, 0.75) * Math.PI) * wide;
    const tooth = Math.sin(t * Math.PI * 9) * wide * 0.09 * Math.sin(t * Math.PI);
    pts.push(new THREE.Vector2(base + tooth, y));
  }
  s.moveTo(0, 0);
  pts.forEach(p => s.lineTo(p.x, p.y));
  for (let i = pts.length - 1; i >= 0; i--) s.lineTo(-pts[i].x, pts[i].y);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.003, bevelEnabled: true, bevelThickness: 0.0015, bevelSize: 0.0018, bevelSegments: 2, curveSegments: 8, steps: 4 });
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    p.setZ(i, z + (x * x) / (wide * 7.0) + (y / len) ** 2 * len * 0.14);
  }
  g.computeVertexNormals();
  return g;
}

[
  { y: 0.17, a: 0.7, tilt: 0.42, len: 0.150, wide: 0.055 },
  { y: 0.36, a: 3.8, tilt: 0.52, len: 0.125, wide: 0.046 }
].forEach((L, i) => {
  const leaf = new THREE.Mesh(leafGeometry(L.len, L.wide), M.leaf);
  leaf.name = `leaf_${i + 1}`;
  leaf.rotation.order = 'YXZ';
  leaf.rotation.y = L.a;
  leaf.rotation.x = -(Math.PI / 2 - L.tilt);
  const pt = stemCurve.getPointAt(Math.min(0.99, L.y / 0.6));
  leaf.position.copy(pt);
  flower.add(leaf);
  const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.0024, 0.001, L.len * 0.9, 8), M.stem);
  rib.name = `leaf_rib_${i + 1}`;
  rib.rotation.copy(leaf.rotation);
  rib.position.copy(leaf.position);
  rib.translateY(L.len * 0.45);
  flower.add(rib);
});

stage.setObject(flower);
</script>
</body>
</html>
